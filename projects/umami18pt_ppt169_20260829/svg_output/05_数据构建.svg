    <use data-icon="tabler-outline/arrow-right" x="654" y="586" width="26" height="26" fill="#9AA8B3" stroke-width="2"/>
    <g id="f3">
      <rect x="684" y="540" width="276" height="120" rx="14" fill="#FFFFFF" stroke="#E3E9ED" stroke-width="1.5"/>
      <circle cx="720" cy="576" r="18" fill="#0E8F86"/><text x="720" y="584" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
      <text x="750" y="584" font-size="26" font-weight="bold" fill="#0B2C47">安全性过滤</text>
      <text x="708" y="622" font-size="24" fill="#273742">毒性 / 致敏 / 肠道稳定性</text>
