      <rect x="824" y="392" width="110" height="40" rx="8" fill="#E8EFF5"/><text x="879" y="419" text-anchor="middle">SDNFEY</text>
      <rect x="950" y="392" width="130" height="40" rx="8" fill="#DFF0EE"/><text x="1015" y="419" text-anchor="middle">… 2–8 肽</text>
