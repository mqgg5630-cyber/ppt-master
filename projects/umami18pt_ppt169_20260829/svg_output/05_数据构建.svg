    <use data-icon="tabler-outline/arrow-right" x="962" y="586" width="26" height="26" fill="#E8743B" stroke-width="2"/>
    <g id="f4">
      <rect x="992" y="540" width="228" height="120" rx="14" fill="#FBE9DD" stroke="#F0DECF" stroke-width="1.5"/>
      <circle cx="1028" cy="576" r="18" fill="#E8743B"/><text x="1028" y="584" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
      <text x="1058" y="584" font-size="26" font-weight="bold" fill="#B5663A">ADMET 评估</text>
