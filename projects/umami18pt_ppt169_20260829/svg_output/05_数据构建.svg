<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F4F6F7"/>

  <g id="page-header" data-pptx-bounds="64 44 1152 110">
