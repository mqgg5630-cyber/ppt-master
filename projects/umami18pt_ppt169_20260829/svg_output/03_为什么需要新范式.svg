        <rect x="920" y="432" width="28" height="24" fill="#E8743B"/><rect x="952" y="432" width="132" height="24" fill="#0E8F86"/>
        <text x="836" y="500" font-size="24" fill="#6B7C8A">成本</text>
        <rect x="920" y="482" width="126" height="24" fill="#E8743B"/><rect x="1050" y="482" width="34" height="24" fill="#0E8F86"/>
        <text x="836" y="550" font-size="24" fill="#6B7C8A">耗时</text>
        <rect x="920" y="532" width="126" height="24" fill="#E8743B"/><rect x="1050" y="532" width="26" height="24" fill="#0E8F86"/>
