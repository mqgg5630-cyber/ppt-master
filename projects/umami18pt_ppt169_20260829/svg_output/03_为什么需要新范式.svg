    <g id="pain-2">
      <rect x="68" y="426" width="708" height="78" rx="16" fill="#F0DECF"/>
      <rect x="64" y="422" width="708" height="78" rx="16" fill="#FBE9DD" stroke="#F0DECF" stroke-width="1.5"/>
