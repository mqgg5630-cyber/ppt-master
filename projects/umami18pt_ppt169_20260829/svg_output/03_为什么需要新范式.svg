  <g id="shift-band" data-pptx-bounds="64 610 1152 60">
    <rect x="64" y="610" width="1152" height="60" rx="16" fill="#0B2C47"/>
    <rect x="64" y="610" width="8" height="60" rx="4" fill="#2FB3A8"/>
